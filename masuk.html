<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SIMA Madrasah</title>
    <style>
        /* --- RESET & MINIMALIS UTAMA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            display: flex;
            align-items: center; /* Membuat kotak pas di tengah vertikal */
            justify-content: center; /* Membuat kotak pas di tengah horizontal */
            padding: 20px;
            overflow: hidden;
        }

        /* --- BINGKAI RAMPING & PRESISI (MAX-WIDTH DIKECILKAN) --- */
        .glass-card {
            position: relative;
            width: 100%;
            max-width: 400px; /* Diperkecil dari sebelumnya agar pas untuk Form Login */
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            padding: 2px; /* Garis pendaran border dibuat lebih tipis halus */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* ANIMASI BORDER GLOW HALUS */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, #38bdf8, #22c55e, transparent 50%);
            animation: rotateGlow 6s linear infinite;
            z-index: 1;
        }

        .glass-card-inner {
            position: relative;
            background: #090d1a;
            border-radius: 18px;
            padding: 35px 30px; /* Padding disesuaikan agar ruang teks tidak sesak */
            z-index: 2;
            text-align: center;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- IDENTITAS FORM --- */
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* --- DESAIN INPUT FIELD --- */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input[type="text"], 
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        /* --- CAPTCHA & REMEMBER ME --- */
        .captcha-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .captcha-box p { color: #94a3b8; margin-bottom: 8px; }
        
        .captcha-code {
            background: linear-gradient(45deg, #1e293b, #334155);
            width: 80px;
            height: 32px;
            border-radius: 6px;
            display: inline-block;
            vertical-align: middle;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .captcha-input {
            width: 70px;
            padding: 6px;
            margin-left: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 6px;
            text-align: center;
            vertical-align: middle;
            outline: none;
        }

        .remember-flex {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: left;
        }

        .remember-flex input { margin-right: 8px; cursor: pointer; }

        /* --- TOMBOL UTAMA --- */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            color: #020617;
            background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .btn-submit:hover {
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* --- INFO DEMO & FOOTER --- */
        .demo-text {
            margin-top: 18px;
            font-size: 0.8rem;
            color: #475569;
        }
        .demo-text span { color: #34d399; font-weight: 600; }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="glass-card-inner">
            
            <header>
                <h1>SIMA MADRASAH</h1>
                <h2>Masuk untuk melanjutkan</h2>
            </header>

            <main>
                <form onsubmit="return false;">
                    <div class="form-group">
                        <label for="username">Nama pengguna</label>
                        <input type="text" id="username" placeholder="Masukkan username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Kata sandi</label>
                        <input type="password" id="password" placeholder="Masukkan password">
                    </div>
                    
                    <div class="captcha-box">
                        <p>Ketik kode pada gambar (verifikasi bukan robot)</p>
                        <div class="captcha-code"></div>
                        <input type="text" class="captcha-input" maxlength="4">
                    </div>

                    <div class="remember-flex">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="cursor: pointer;">Ingat saya di perangkat ini</label>
                    </div>

                    <button type="submit" class="btn-submit">Masuk Sistem</button>
                </form>

                <p class="demo-text">
                    Akun demo (kata sandi: <span>demo123</span>). Klik untuk mengisi.
                </p>
                
                <a href="index.html" class="back-link">&larr; Kembali ke Beranda</a>
            </main>

        </div>
    </div>

</body>
</html>
